# puerto del servidor Spring Boot
server.port=8080

# conexion a MySQL (Base de datos tarea2)
spring.datasource.url=jdbc:mysql://localhost:3306/tarea2?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.username=cc5002
spring.datasource.password=programacionweb
# no estoy segura si debo colocar la contraseña, ya que la base de datos local usa la contraseña

# configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# indica a Spring Boot que use tus carpetas de la raiz (igual que en Flask)
spring.thymeleaf.prefix=file:templates/
spring.thymeleaf.cache=false
spring.web.resources.static-locations=file:static/